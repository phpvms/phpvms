---
name: release
on:
  release:
    types: [ published ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    strategy:
      matrix:
        os: [ ubuntu-latest ]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # https://github.com/marketplace/actions/gittools
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: '6.0.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.7.0
        with:
          useConfigFile: true
          configFilePath: .github/version.yml

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      # Configure Caching
      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

#       - name: Update Release Notes
#         uses: ./gitreleasemanager/create
#         with:
#           token: ${{ secrets.RELEASE_GITHUB_TOKEN }}
#           owner: ${{ github.repository_owner }}
#           repository: phpvms
#           milestone: "v${{ steps.gitversion.outputs.majorMinorPatch }}"
#           name: "v${{ steps.gitversion.outputs.majorMinorPatch }}"
#           isPreRelease: ${{ github.event.release.prerelease }}
#           targetcommitish: 'main'

        # Dependencies
      - name: 'Install Release Dependencies'
        run: |
          rm -rf vendor
          composer install --no-dev --prefer-dist --no-interaction --verbose
          composer dump-autoload
          sudo chmod +x ./.github/scripts/*

      - id: version
        name: Get version
        env:
          GIT_TAG_NAME: ${{ github.event.release.tag_name }}
        run: .github/scripts/version.sh

      - name: Build Distro
        run: .github/scripts/build.sh

      # Dependencies
      - name: 'List files'
        run: |
          find . -maxdepth 2  -type f

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/*.*"
          allowUpdates: true
          generateReleaseNotes: true
          name: ${{ github.ref_name }}
          tag: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Bunny storage
        env:
          AWS_ACCESS_KEY_ID: phpvms
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUNNY_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          # AWS CLI v2.23+ sends checksum headers many S3-compatible stores reject
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        run: |
          aws s3 cp dist/ s3://phpvms/ --recursive \
            --endpoint-url https://ny-s3.storage.bunnycdn.com

#       - name: Add Assets
#         uses: ./gitreleasemanager/addasset
#         with:
#           token: ${{ secrets.RELEASE_GITHUB_TOKEN }}
#           owner: ${{ github.repository_owner }}
#           repository: phpvms
#           targetDirectory: dist/
#           assets: ${{ env.TAR_NAME }},${{ env.TAR_NAME }}.sha256,${{ env.ZIP_NAME }},${{ env.ZIP_NAME }}.sha256

#       - name: Close Release
#         uses: ./gitreleasemanager/close
#         with:
#           token: ${{ secrets.RELEASE_GITHUB_TOKEN }}
#           owner: ${{ github.repository_owner }}
#           repository: actions
#           milestone: "v${{ steps.gitversion.outputs.majorMinorPatch }}"

      # Push to Docker
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Discord notification
        uses: Ilshidur/action-discord@0.3.2
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: ${{ steps.version.outputs.discord_msg }}
