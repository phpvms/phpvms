---
# Triggered by publishing a GitHub release. The tag is the version
# (8.0.0-alpha.1, 8.0.0, 8.0.1); the release's prerelease checkbox is the only
# switch. See docs/how-to-release.md.
name: release
on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  package:
    name: "Build and publish package"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install release dependencies (no scripts)
        run: |
          rm -rf vendor
          composer install --no-dev --prefer-dist --no-interaction --no-scripts
          chmod +x ./.github/scripts/*

      - name: Install NPM dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile assets
        run: pnpm run build

      - name: Run Composer post-autoload scripts
        run: composer dump-autoload

      - name: Publish Filament assets
        run: php artisan filament:assets

      - id: version
        name: Stamp version
        run: .github/scripts/version.sh

      - name: Build distro
        run: .github/scripts/build.sh

      - name: Attach assets to the release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/*.*"
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          tag: ${{ github.event.release.tag_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Bunny storage
        env:
          AWS_ACCESS_KEY_ID: phpvms
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUNNY_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          # AWS CLI v2.23+ sends checksum headers many S3-compatible stores reject
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        run: |
          aws s3 cp dist/ s3://phpvms/ --recursive \
            --endpoint-url https://ny-s3.storage.bunnycdn.com

      - name: Discord notification
        uses: Ilshidur/action-discord@0.3.2
        env:
          DISCORD_WEBHOOK: ${{ secrets.V8_DISCORD_WEBHOOK }}
        with:
          args: ${{ steps.version.outputs.discord_msg }}

  docker:
    name: "Build and push Docker image"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Dockerfile.prod copies the tree in and runs composer install, so the
      # image reports the release tag the same way the package does.
      - name: Stamp version
        run: composer config version "${{ github.event.release.tag_name }}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest=auto only tags :latest for non-prerelease semver tags
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
