name: phpvms-test
services:
  mysql:
    image: mysql:8.4
    ports:
      - "13306:3306"
    environment:
      MYSQL_DATABASE: testing
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - mysql-test-data:/var/lib/mysql
      - ./vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--password=password"]
      retries: 5
      timeout: 5s
      start_period: 15s

  # Not a duplicate of the mysql service above. Laravel drives MariaDB through
  # its own driver and schema grammar, and the two servers do not offer the same
  # collations, so a schema change can pass on one and fail on the other. Most
  # phpVMS installs run MariaDB. 11.4 is the current LTS, matching CI.
  mariadb:
    image: mariadb:11.4
    ports:
      - "13307:3306"
    environment:
      MARIADB_DATABASE: testing
      MARIADB_ROOT_PASSWORD: password
    volumes:
      - mariadb-test-data:/var/lib/mysql
      - ./vendor/laravel/sail/database/mariadb/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh:ro
    # `healthcheck.sh`, not `mysqladmin ping`: the MariaDB image ships no
    # `mysqladmin` at all, only `mariadb-admin`.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      retries: 5
      timeout: 5s
      start_period: 15s

  pgsql:
    image: postgres:18-alpine
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: testing
      POSTGRES_USER: phpvms
      POSTGRES_PASSWORD: password
    volumes:
      - pgsql-test-data:/var/lib/postgresql
      - ./vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql:ro
      - ./resources/docker/pgsql/01-test-user.sql:/docker-entrypoint-initdb.d/01-test_user.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "testing", "-U", "phpvms"]
      retries: 3
      timeout: 5s
      start_period: 10s

volumes:
  mysql-test-data:
  mariadb-test-data:
  pgsql-test-data:
